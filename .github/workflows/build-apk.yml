name: Debug Build APK

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check folder structure
        run: |
          echo "Current directory listing:"
          ls -l
          echo "-----------------------------"
          echo "Searching for pubspec.yaml..."
          find . -name "pubspec.yaml"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
