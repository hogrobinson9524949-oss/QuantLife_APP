name: Debug Folders

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: List all folders
        run: |
          echo "🔍 正在扫描仓库根目录下的所有文件和文件夹："
          echo "----------------------------------"
          find . -maxdepth 1 -type d
          echo "----------------------------------"
          echo ""
          echo "🔍 正在全局寻找 pubspec.yaml（Flutter 项目标识文件）："
          echo "----------------------------------"
          find . -name "pubspec.yaml"
          echo "----------------------------------"
